version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kisan_saarthi
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEBUG=False
    depends_on:
      - mongodb
    env_file:
      - ../../.env

volumes:
  mongo_data: